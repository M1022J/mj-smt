<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MJ SMT 编程工作台</title>
<style>
:root,[data-theme="light"]{
  --bg:#e9edf4; --bg2:#f7f9fc; --bg3:#edf1f7; --panel:#ffffff; --panel2:#ffffff;
  --line:#d8dfea; --txt:#2c3444; --dim:#7c8698; --mut:#9aa4b6;
  --acc:#2f7bff; --acc2:#1fae6b; --warn:#e8930c; --bad:#e05252; --badtx:#d43a3a;
  --btn:#ffffff; --btn-h:#eaf2ff; --inp:#f3f6fa; --th:#edf1f7; --sel:#cfe2ff; --rowon:#e6efff;
  --grad:linear-gradient(90deg,#2b6bff 0%,#1d9bf0 55%,#17b8d8 100%);
  --shadow:0 10px 26px rgba(35,60,110,.16); --maskbg:rgba(28,42,70,.45); --sbar:#c2ccd9; --ok:#1d9e5f;
}
[data-theme="dark"]{
  --bg:#101218; --bg2:#171a21; --bg3:#1f232d; --panel:#1b1e26; --panel2:#22252f;
  --line:#333845; --txt:#dde1ea; --dim:#9aa3b5; --mut:#6d7688;
  --acc:#3d8bff; --acc2:#2fbf71; --warn:#f0a13c; --bad:#e05252; --badtx:#ff9a9a;
  --btn:#262a35; --btn-h:#313745; --inp:#14161c; --th:#232733; --sel:#2c4a7d; --rowon:#2b3040;
  --grad:linear-gradient(90deg,#1e3a8a 0%,#2563eb 55%,#0e7ea6 100%);
  --shadow:0 10px 26px rgba(0,0,0,.5); --maskbg:rgba(0,0,0,.55); --sbar:#45454f; --ok:#8fd0a8;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{background:var(--bg); color:var(--txt); font:13px/1.45 "Microsoft YaHei","PingFang SC",sans-serif; overflow:hidden; user-select:none;}
button{background:var(--btn); color:var(--txt); border:1px solid var(--line); border-radius:7px; padding:3px 10px; cursor:pointer; font-size:12px; white-space:nowrap;}
button:hover{background:var(--btn-h);}
button.acc{background:linear-gradient(135deg,#2f7bff,#17a8e0); border-color:transparent; color:#fff;}
button.acc:hover{filter:brightness(1.08);}
button.grn{background:var(--acc2); border-color:var(--acc2); color:#fff;}
button.org{background:#e07f1f; border-color:#e07f1f; color:#fff;}
button:disabled{opacity:.45; cursor:default;}
input,select,textarea{background:var(--inp); color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:3px 6px; font-size:12px;}
input[type=number]{width:74px;}
textarea{width:100%; min-height:90px; font-family:Consolas,monospace;}
table{border-collapse:collapse; width:100%; font-size:12px;}
th,td{border-bottom:1px solid var(--line); padding:2px 5px; text-align:left; white-space:nowrap; overflow:hidden; max-width:170px; text-overflow:ellipsis;}
th{background:var(--th); color:var(--dim); font-weight:normal; position:sticky; top:0;}
tr.sel td{background:var(--sel);}
tr.bad td{color:var(--badtx);}
::-webkit-scrollbar{width:9px;height:9px;} ::-webkit-scrollbar-thumb{background:var(--sbar);border-radius:4px;} ::-webkit-scrollbar-track{background:transparent;}

#app{display:flex; flex-direction:column; height:100vh;}
#titlebar{height:38px; background:var(--grad); color:#fff; display:flex; align-items:center; padding:0 10px; gap:10px; flex:none;}
#titlebar .logo{background:rgba(255,255,255,.22); border:1px solid rgba(255,255,255,.45); color:#fff; font-weight:800; font-size:15px; letter-spacing:1px; padding:1px 8px; border-radius:8px;}
#titlebar .appname{font-weight:700; font-size:13px; color:#fff;}
#titlebar .ttl{color:rgba(255,255,255,.78);}
#titlebar .tsp{flex:1;}
#themeToggle{position:relative; width:56px; height:26px; flex:none; padding:0; border-radius:999px; background:rgba(255,255,255,.22); border:1px solid rgba(255,255,255,.55); cursor:pointer;}
#themeToggle:hover{background:rgba(255,255,255,.3);}
#themeToggle svg{position:absolute; top:50%; transform:translateY(-50%); width:14px; height:14px; pointer-events:none;}
#themeToggle .ic-sun{left:6px;}
#themeToggle .ic-moon{right:6px;}
#themeToggle .tk{position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.35); transition:left .18s ease; pointer-events:none;}
[data-theme="dark"] #themeToggle .tk{left:32px;}
#main{flex:1; display:flex; min-height:0;}

/* 左模块栏 */
#modbar{width:86px; background:var(--bg2); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:6px 0;}
#modbar .mod{padding:9px 4px; margin:1px 6px; border-radius:10px; text-align:center; cursor:pointer; color:var(--dim); font-size:12px; display:flex; flex-direction:column; align-items:center; gap:2px;}
#modbar .mod::before{font-size:17px; line-height:1.15; color:var(--mc,#8a94a6);}
#modbar .mod[data-mod="smt"]{--mc:#2f7bff;} #modbar .mod[data-mod="smt"]::before{content:"▣";}
#modbar .mod[data-mod="bomcad"]{--mc:#0fb5a3;} #modbar .mod[data-mod="bomcad"]::before{content:"▦";}
#modbar .mod[data-mod="simplify"]{--mc:#f08c1a;} #modbar .mod[data-mod="simplify"]::before{content:"≣";}
#modbar .mod[data-mod="compare"]{--mc:#8b5cf6;} #modbar .mod[data-mod="compare"]::before{content:"◧";}
#modbar .mod[data-mod="customer"]{--mc:#ec4899;} #modbar .mod[data-mod="customer"]::before{content:"✦";}
#modbar .mod[data-mod="fixture"]{--mc:#06a8c9;} #modbar .mod[data-mod="fixture"]::before{content:"⬢";}
#modbar .mod[data-mod="reflow"]{--mc:#ef4444;} #modbar .mod[data-mod="reflow"]::before{content:"∿";}
#modbar .mod[data-mod="annotate"]{--mc:#22a06b;} #modbar .mod[data-mod="annotate"]::before{content:"✎";}
#modbar .mod[data-mod="settings"]{--mc:#64748b;} #modbar .mod[data-mod="settings"]::before{content:"⚙";}
#modbar #modExit{--mc:#e05252;} #modbar #modExit::before{content:"⏻";}
#modbar .mod:hover{color:var(--txt); background:var(--btn-h);}
#modbar .mod.on{color:#fff; background:linear-gradient(135deg,#2f7bff,#17a8e0);}
#modbar .mod.on::before{color:#fff;}
#modbar .sp{flex:1;}

/* 中列 */
#center{flex:1; display:flex; flex-direction:column; min-width:0;}
#menubar{height:30px; background:var(--bg2); display:flex; align-items:center; padding:0 6px; gap:2px; border-bottom:1px solid var(--line); position:relative; z-index:60;}
.menu{padding:3px 10px; cursor:pointer; border-radius:6px;}
.menu:hover,.menu.open{background:var(--btn-h);}
.dropdown{position:absolute; top:30px; background:var(--panel2); border:1px solid var(--line); border-radius:9px; min-width:210px; box-shadow:var(--shadow); padding:4px 0; display:none; z-index:100;}
.dropdown.open{display:block;}
.dropdown .mi{padding:5px 14px; cursor:pointer; display:flex; justify-content:space-between; gap:18px;}
.dropdown .mi:hover{background:var(--acc); color:#fff;}
.dropdown .mi.dis{color:var(--mut); cursor:default;}
.dropdown .mi.dis:hover{background:transparent; color:var(--mut);}
.dropdown .sep{height:1px; background:var(--line); margin:4px 0;}
.dropdown .mi .k{color:var(--dim); font-size:11px;}
.dropdown .mi:hover .k{color:#dbe7ff;}

#toolbar{padding:5px 8px 3px; background:var(--bg2); border-bottom:1px solid var(--line);}
#toolbar .row{display:flex; align-items:center; gap:5px; margin-bottom:4px; flex-wrap:wrap;}
#toolbar .sep{width:1px; height:20px; background:var(--line); margin:0 3px;}
#toolbar .grow{flex:1;}
.tgl.on{background:var(--acc); color:#fff; border-color:var(--acc);}

#canvaswrap{flex:1; position:relative; background:#0a0a0c; min-height:0;}
#cv{position:absolute; inset:0; width:100%; height:100%; display:block; cursor:crosshair;}
#canvasHint{position:absolute; left:8px; top:6px; color:#6d6e7a; font-size:11px; pointer-events:none;}
#statusbar{height:24px; background:var(--bg2); border-top:1px solid var(--line); display:flex; align-items:center; gap:14px; padding:0 10px; font-size:12px; color:var(--dim); overflow:hidden; white-space:nowrap;}
#statusbar b{color:var(--txt); font-weight:normal;}
#statusMsg{color:var(--ok); flex:1; overflow:hidden; text-overflow:ellipsis;}

/* 右侧 */
#right{width:400px; background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0;}
#tabs{display:flex; background:var(--bg2); border-bottom:1px solid var(--line); padding:3px 4px; gap:2px;}
#tabs .tab{padding:5px 10px; cursor:pointer; color:var(--dim); border-radius:8px; font-size:12px;}
#tabs .tab.on{color:#fff; background:linear-gradient(135deg,#2f7bff,#17a8e0);}
#tabbody{flex:1; overflow:auto; padding:7px; min-height:0;}
#layerpanel{border-top:1px solid var(--line); max-height:238px; display:flex; flex-direction:column; background:var(--panel);}
#layerpanel .lp-head{display:flex; align-items:center; gap:4px; padding:5px 7px; background:var(--bg2); font-size:12px;}
#layerlist{overflow:auto;}
.lrow{display:flex; align-items:center; gap:5px; padding:3px 7px; cursor:pointer; font-size:12px;}
.lrow.on{background:var(--rowon);}
.lrow .sw{width:12px; height:12px; border-radius:2px; border:1px solid rgba(0,0,0,.25); flex:none;}
.lrow .nm{flex:1; overflow:hidden; text-overflow:ellipsis;}
.lrow .cnt{color:var(--dim);}
.lrow.err .nm{color:var(--badtx);}
#readout{padding:5px 8px; border-top:1px solid var(--line); font-size:12px; color:var(--dim); display:grid; grid-template-columns:1fr 1fr; gap:2px 10px;}
#readout b{color:var(--txt); font-weight:normal;}

.sec{margin-bottom:10px;}
.sec>h4{font-size:12px; color:var(--dim); font-weight:normal; margin-bottom:5px; border-bottom:1px solid var(--line); padding-bottom:3px;}
.kv{display:grid; grid-template-columns:auto 1fr auto 1fr; gap:4px 6px; align-items:center; margin-bottom:5px;}
.kv2{display:grid; grid-template-columns:auto 1fr; gap:4px 6px; align-items:center; margin-bottom:5px;}
.btnrow{display:flex; gap:5px; flex-wrap:wrap; margin:5px 0;}
.note{color:var(--dim); font-size:11px;}
.tag{display:inline-block; padding:0 5px; border-radius:8px; font-size:11px; background:var(--bg3); color:var(--dim);}
.tag.g{background:#1fae6b; color:#fff;} .tag.r{background:#e05252; color:#fff;} .tag.y{background:#e8930c; color:#fff;}
.pill{font-size:11px; color:var(--dim);}

/* 模态 */
.mask{position:fixed; inset:0; background:var(--maskbg); display:none; z-index:200; align-items:center; justify-content:center;}
.mask.open{display:flex;}
.dlg{background:var(--panel2); border:1px solid var(--line); border-radius:12px; width:860px; max-width:96vw; max-height:92vh; display:flex; flex-direction:column; box-shadow:var(--shadow);}
.dlg.wide{width:1060px;}
.dlg .dh{padding:9px 13px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; font-size:13px;}
.dlg .db{padding:10px 13px; overflow:auto;}
.dlg .df{padding:9px 13px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:6px;}
.x{cursor:pointer; color:var(--dim); padding:0 4px;} .x:hover{color:var(--txt);}

/* 模块覆盖视图（BOM整理等） */
#moduleView{position:absolute; inset:0; background:var(--bg); display:none; flex-direction:column; z-index:40;}
#moduleView.open{display:flex;}
#moduleView .mv-head{padding:8px 12px; background:var(--bg2); border-bottom:1px solid var(--line); display:flex; gap:8px; align-items:center;}
#moduleView .mv-body{flex:1; overflow:auto; padding:10px 12px;}
.split{display:flex; gap:12px;} .split>div{flex:1; min-width:0;}
.ctxmenu{position:fixed; background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:4px 0; z-index:300; min-width:180px; box-shadow:var(--shadow); display:none;}
.ctxmenu .mi{padding:5px 14px; cursor:pointer;} .ctxmenu .mi:hover{background:var(--acc); color:#fff;}
#toast{position:fixed; left:50%; bottom:38px; transform:translateX(-50%); background:var(--panel2); border:1px solid var(--line); color:var(--txt); padding:7px 16px; border-radius:8px; z-index:400; display:none; max-width:80vw; box-shadow:var(--shadow);}
.stat3{display:flex; gap:14px; margin:6px 0;}
.stat3 div{background:var(--bg3); border:1px solid var(--line); border-radius:9px; padding:6px 12px;}
.stat3 b{font-size:16px; display:block;}
/* 处理明细 8 步流程条 */
.flowbar{display:flex; align-items:center; flex-wrap:wrap; gap:4px; margin:4px 0 10px;}
.flowbar .fst{padding:5px 12px; border-radius:12px; border:1px solid var(--line); background:var(--bg3); color:var(--mut); font-size:12px;}
.flowbar .fst.done{background:#1fae6b; border-color:#1fae6b; color:#fff;}
.flowbar .fst.cur{background:linear-gradient(135deg,#2f7bff,#17a8e0); border-color:transparent; color:#fff;}
.flowbar .farr{color:var(--mut);}
/* 丝印识别进度窗（居中模态） */
#silkProg{position:fixed; inset:0; background:var(--maskbg); z-index:500; display:flex; align-items:center; justify-content:center;}
#silkProg .sp-box{background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:18px 22px; width:430px; max-width:92vw; box-shadow:var(--shadow);}
#silkProg .sp-bar{height:12px; background:var(--inp); border:1px solid var(--line); border-radius:6px; overflow:hidden; margin:10px 0 4px;}
#silkProg .sp-fill{height:100%; background:linear-gradient(90deg,#2f7bff,#17b8d8); width:0%; transition:width .15s;}
</style>
<script>try{var _t=localStorage.getItem("mj-theme");if(_t==="dark"||_t==="light")document.documentElement.setAttribute("data-theme",_t);}catch(e){}</script>
</head>
<body>
<div id="app">
  <div id="titlebar"><span class="logo">MJ</span><span class="appname">SMT 编程工作台</span><span class="ttl" id="projName">未命名工程</span><span class="ttl" id="saveState"></span><span class="tsp"></span><button id="themeToggle" title="切换浅色 / 深色主题" aria-label="切换浅色 / 深色主题"><svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2" fill="#FFC93C"/><g stroke="#FFC93C" stroke-width="2" stroke-linecap="round"><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5 5l1.7 1.7M17.3 17.3L19 19M19 5l-1.7 1.7M6.7 17.3L5 19"/></g></svg><svg class="ic-moon" viewBox="0 0 24 24"><path d="M20.6 14.5A8.8 8.8 0 1 1 9.5 3.4a7.2 7.2 0 0 0 11.1 11.1z" fill="#CFE4FF"/></svg><span class="tk"></span></button></div>
  <div id="main">
    <div id="modbar">
      <div class="mod on" data-mod="smt">SMT编程</div>
      <div class="mod" data-mod="bomcad">BOM+CAD</div>
      <div class="mod" data-mod="simplify">BOM整理</div>
      <div class="mod" data-mod="compare">BOM比对</div>
      <div class="mod" data-mod="customer">客户方案</div>
      <div class="mod" data-mod="fixture">治具生成</div>
      <div class="mod" data-mod="reflow">回流焊推荐</div>
      <div class="mod" data-mod="annotate">图片标注</div>
      <div class="sp"></div>
      <div class="mod" data-mod="settings">设置</div>
      <div class="mod" id="modExit">退出</div>
    </div>
    <div id="center">
      <div id="menubar">
        <div class="menu" data-menu="file">文件</div>
        <div class="menu" data-menu="view">视图</div>
        <div class="menu" data-menu="coord">坐标操作</div>
        <div class="menu" data-menu="db">数据库</div>
        <div class="menu" data-menu="help">帮助</div>
        <div class="dropdown" id="dd"></div>
      </div>
      <div id="toolbar">
        <div class="row">
          <button id="tbGerber" class="acc">导入Gerber</button>
          <button id="tbAlign">智能重合</button>
          <button id="tbExtract" class="tgl on">坐标提取</button>
          <button id="tbFindSame">查找相同</button>
          <button id="tbRange" class="tgl">提取范围</button>
          <button id="tbSilk">丝印识别</button>
          <span class="sep"></span>
          <button id="tbCad">导入CAD</button>
          <button id="tbMerge">合并BOM</button>
          <button id="tbAngle">角度校正</button>
          <button id="tbPkg">封装检查</button>
          <button id="tbPanel">智能拼板</button>
          <span class="sep"></span>
          <button id="tbStencil">钢网▾</button>
        </div>
        <div class="row">
          <button id="tbSample" class="grn">载入样例工程</button>
          <span class="sep"></span>
          <span class="grow"></span>
          <button id="tbReadProg">读取程序▾</button>
          <button id="tbOutput">输出程序▾</button>
          <button id="tbConvert">转换坐标</button>
          <button id="tbRotate">旋转</button>
          <button id="tbMirror">镜像</button>
          <span class="sep"></span>
          <span class="pill">面别</span>
          <button id="tbSide" class="tgl on">T</button>
        </div>
      </div>
      <div id="canvaswrap">
        <canvas id="cv"></canvas>
        <div id="canvasHint">左键点选/框选 · 右键提取并写位号 · 滚轮缩放 · 中键/空格拖动平移</div>
        <div id="moduleView">
          <div class="mv-head"><b id="mvTitle">模块</b><span class="grow" style="flex:1"></span><button id="mvClose">返回 SMT 编程</button></div>
          <div class="mv-body" id="mvBody"></div>
        </div>
      </div>
      <div id="statusbar">
        <span>图层 <b id="stLayer">-</b></span>
        <span>X <b id="stX">0.000</b></span>
        <span>Y <b id="stY">0.000</b></span>
        <span>缩放 <b id="stZoom">100%</b></span>
        <span>选中 <b id="stSel">0</b></span>
        <span>坐标总数 <b id="stCoords">0</b></span>
        <span id="statusMsg"></span>
        <span id="stTime"></span>
      </div>
    </div>
    <div id="right">
      <div id="tabs">
        <div class="tab on" data-tab="place">贴片数据</div>
        <div class="tab" data-tab="board">基板数据</div>
        <div class="tab" data-tab="comp">元件数据</div>
        <div class="tab" data-tab="feeder">站位表</div>
        <div class="tab" data-tab="cfg">设置</div>
      </div>
      <div id="tabbody"></div>
      <div id="layerpanel">
        <div class="lp-head"><b>坐标层</b><span style="flex:1"></span>
          <button id="lpAdd" title="添加空层">＋层</button>
          <button id="lpUp" title="上移层序">↑</button>
          <button id="lpDown" title="下移层序">↓</button>
          <button id="lpFlip" title="层翻转（镜像生成对面层）">翻转</button>
          <button id="lpMerge" title="层合并导出 Gerber">合并</button>
          <button id="lpDel" title="删除层">删</button>
        </div>
        <div id="layerlist"></div>
        <div id="readout">
          <span>当前坐标 <b id="roCur">-</b></span>
          <span>元件中心 <b id="roCenter">-</b></span>
          <span>测量 <b id="roMeas">-</b></span>
          <span>计算角度 <b id="roAng">-</b></span>
          <span>焊盘内间距 <b id="roGap">-</b></span>
          <span><button id="btnMeasure" class="tgl">测量模式</button></span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 通用弹窗 -->
<div class="mask" id="mask"><div class="dlg" id="dlg">
  <div class="dh"><span id="dlgTitle">对话框</span><span class="x" id="dlgX">✕</span></div>
  <div class="db" id="dlgBody"></div>
  <div class="df" id="dlgFoot"></div>
</div></div>

<div class="ctxmenu" id="ctxmenu"></div>
<div id="toast"></div>
<input type="file" id="fileGerber" multiple accept=".gtp,.gts,.gto,.gtl,.gko,.gbl,.gbs,.gbo,.gbp,.ger,.gbr,.drl,.zip" style="display:none">
<input type="file" id="fileZip" accept=".zip" style="display:none">
<input type="file" id="fileCad" accept=".csv,.txt" style="display:none">
<input type="file" id="fileBom" accept=".xlsx,.csv,.txt" style="display:none">
<input type="file" id="fileBom2" accept=".xlsx,.csv,.txt" style="display:none">
<input type="file" id="fileProj" accept=".json" style="display:none">
<input type="file" id="filePcb" accept=".PcbDoc,.pcbdoc" style="display:none">

<script id="core">
"use strict";
/* ============================================================
   MJ SMT 工作台 — 纯逻辑核心（不碰 DOM，Node 可提取运行）
   ============================================================ */
const Core = (() => {

/* ---------- 工具 ---------- */
const round3 = v => Math.round(v * 1000) / 1000;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function bboxOf(pts) {
  let x0 = 1e18, y0 = 1e18, x1 = -1e18, y1 = -1e18;
  for (const p of pts) { if (p.x < x0) x0 = p.x; if (p.y < y0) y0 = p.y; if (p.x > x1) x1 = p.x; if (p.y > y1) y1 = p.y; }
  return { x0, y0, x1, y1, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, w: x1 - x0, h: y1 - y0 };

  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }

    proc.forEach((p, j) => { if (used.has(j)) return; const d = dist(o, p); if (d < bd) { bd = d; best = { p, j }; } });
    const name = o.name || ('器件' + (i + 1));
    if (!best || bd > 1.0) { rows.push({ name, dev: null, ow: o.w, oh: o.h, pw: 0, ph: 0, area: 0, ar: 0, verdict: '问题', why: '处理后缺失' }); return; }
    used.add(best.j);
    const p = best.p, area = p.w * p.h, ar = area / (2 * (p.w + p.h) * t);
    let verdict, why;
    if (ar >= 0.66) { verdict = '合格'; why = 'AR≥0.66'; }
    else if (ar >= 0.62) { verdict = '临界'; why = '0.62≤AR<0.66 临界'; }
    else { verdict = '问题'; why = 'AR<0.62'; }
    rows.push({ name, dev: round3(bd), ow: o.w, oh: o.h, pw: p.w, ph: p.h, area: round3(area), ar: round3(ar), verdict, why });
  });
  return rows;
}

/* ---------- 倒装 BGA 球位 POS 导出（R35 改版，自明示版式） ----------

   本版式由本软件自明示：文件头注释写清每列含义，内容为 BGA 球位逐点坐标，不冒充官方格式。 */
function genPOS(balls, opts = {}) {
  const dia = opts.dia ?? 0.3;
  const sorted = [...balls].sort((a, b) => (b.y - a.y) || (a.x - b.x));
  let cx = 0, cy = 0; sorted.forEach(b => { cx += b.x / sorted.length; cy += b.y / sorted.length; });
  const lines = [
    '; MJ SMT 工作台 — 倒装 BGA 球位 POS 输出（本软件自明示版式，非官方格式）',
    '; 列定义（Tab 分隔，共 4 列）：',
    ';  第1列 球位编号（提取顺序 P_n）',
    ';  第2列 X — 相对球阵整体中心的 X 坐标（mm）',
    ';  第3列 Y — 相对球阵整体中心的 Y 坐标（mm）',
    ';  第4列 球径（mm）',
    '; 球数 ' + sorted.length + (opts.mirrorX ? '，已镜像 X' : '') + (opts.mirrorY ? '，已镜像 Y' : ''),
  ];
  sorted.forEach((b, i) => {
    let x = b.x - cx, y = b.y - cy;
    if (opts.mirrorX) x = -x; if (opts.mirrorY) y = -y;
    lines.push(`${b.ref || 'P_' + (i + 1)}\t${x.toFixed(3)}\t${y.toFixed(3)}\t${dia.toFixed(2)}`);
  });
  return { text: lines.join('\n') + '\n', count: sorted.length };
}

/* ---------- 导出（R34/R40） ---------- */
function coordsToText(coords, fmt) {
  const head = fmt === 'csv' ? '位号,X,Y,角度,面,料号,规格' : '位号\tX\tY\t角度\t面\t料号\t规格';
  const sep = fmt === 'csv' ? ',' : '\t';
  const lines = [head];
  for (const c of coords) lines.push([c.ref, c.x.toFixed(3), c.y.toFixed(3), c.rot, c.side, c.partNo || '', (c.spec || '').replace(/,/g, ' ')].join(sep));
  return lines.join('\n') + '\n';
}
/* 位号-坐标三档匹配（R40）：档1 严格≤3mm / 档2 ≤8mm 同类型 / 档3 ≤12mm 任意 */
function matchRefTiers(labels, coords) {
  const res = { strict: 0, standard: 0, loose: 0, unmatched: 0, detail: [] };
  for (const lb of labels) {
    let bd = 1e18, bc = null;
    for (const c of coords) { const d = Math.hypot(lb.x - c.x, lb.y - c.y); if (d < bd) { bd = d; bc = c; } }
    const sameType = bc && (lb.ref.replace(/[0-9]/g, '') === bc.ref.replace(/[0-9]/g, ''));
    let tier = '未匹配';
    if (bd <= 3) { tier = '档1·严格'; res.strict++; }
    else if (bd <= 8 && sameType) { tier = '档2·标准'; res.standard++; }
    else if (bd <= 12) { tier = '档3·宽松'; res.loose++; }
    else res.unmatched++;
    res.detail.push({ ref: lb.ref, x: lb.x, y: lb.y, tier, dist: round3(bd), matchedRef: bc ? bc.ref : '' });
  }
  return res;
}

/* ---------- 红胶派生 + 钢网产物套件（sean_gaps.md ③④） ---------- */
/* 红胶层由锡膏层派生：按元件名分组取焊盘中心生成胶点（顶层 .glu / 底层 .glub）。
   原产品证据只有「上传勾选 + glue 专属方案 + 由锡膏层派生子集」这一层，胶点大小/间距等点胶细则
   无任何画面证据——这里的胶点直径是可改参数、不是原产品参数，并在导出文件头注明；无元件名的图元不派生。 */
function deriveGluePrims(pastePrims, opts = {}) {
  const dia = opts.dia ?? 1.0;
  const groups = new Map();
  for (const p of pastePrims) { if (p.k !== 'f' || !p.name) continue; if (!groups.has(p.name)) groups.set(p.name, []); groups.get(p.name).push(primCenter(p)); }
  return [...groups.entries()].map(([name, cs]) => ({ k: 'f', shape: 'C', x: round3(cs.reduce((s, c) => s + c.x, 0) / cs.length), y: round3(cs.reduce((s, c) => s + c.y, 0) / cs.length), w: dia, h: dia, rot: 0, pol: 'D', name }));
}
/* 产物套件（SEAN 主系统 com_ 命名实证）：丝印 .gxo / 钢网（锡膏） .gxp / 阻焊 .gxs，统一 com_ 前缀；
   铜层、钻孔等其它层保持各自原始扩展名；红胶按 opts.glue 由锡膏层派生：顶层锡膏文件名 + .glu，
   底层先翻转再派生 .glub（文件名 flip_ 前缀）；模板文件要求口径里红胶产物另记为 gxrt/gxrb。 */
function stencilSuiteFiles(layers, opts = {}) {
  const EXT = { silk: 'gxo', paste: 'gxp', solder: 'gxs' };
  const files = []; const notes = [];
  const enc = new TextEncoder();
  const push = (name, text) => files.push({ name, text, data: enc.encode(text) });
  for (const l of layers) {
    const base = String(l.fileName || l.name).replace(/\.[^.]*$/, '');
    const ext = EXT[l.kind] || (String(l.fileName || '').split('.').pop() || 'ger');
    push('com_' + base + '.' + ext, writeGerber(l.prims, l.name));
  }
  if (opts.glue) {
    for (const l of layers.filter(x => x.kind === 'paste')) {
      const base = String(l.fileName || l.name).replace(/\.[^.]*$/, '');
      const glue = deriveGluePrims(l.prims, opts);
      if (!glue.length) { notes.push(l.name + '：无带元件名的焊盘，未派生红胶层'); continue; }
      const head = 'G04 红胶层由锡膏层派生：按元件名分组取焊盘中心生成胶点，胶点直径 ' + (opts.dia ?? 1.0) + 'mm（本软件可改参数）；点胶细则原产品无公开证据，此为派生口径注明 *\n';
      if (l.side === 'B') push('flip_' + base + '.glub', head + writeGerber(glue, l.name + '-红胶'));
      else push(base + '.glu', head + writeGerber(glue, l.name + '-红胶'));
    }
  }
  return { files, notes };
}

/* ---------- 回流焊推荐（参数口径 = StarCompute/reflow_ai 的 config.py，见 external_evidence.md 1.2） ----------
   这里是按其生产工艺窗口做硬约束的规则推荐，不是原仓库的贝叶斯优化/ML 模型；越窗参数钳制并注明。
   注意原仓库许可：个人使用免费、企业/组织商用需另行授权——此处只复刻其公开的工艺窗口数值。 */
const REFLOW_WINDOW = { peak_temp: [235, 250], tal: [45, 90], ramp_up: [1.0, 3.0], ramp_down: [-4.0, -1.0], delta_t: [0, 15], soak_temp: [150, 200], time_above_183: [60, 120], chain_speed: [40, 120], zone_num: 8 };

function recommendReflow(input = {}) {
  const solder = REFLOW_SOLDERS[input.solder] ? input.solder : 'SAC305';
  const board = input.board || 'FR-4', comp = input.comp || '普通';
  const base = { SAC305: { peak: 245, soak: 175, tal: 60, ta183: 90 }, SN100C: { peak: 243, soak: 172, tal: 58, ta183: 88 }, SN63PB37: { peak: 228, soak: 160, tal: 50, ta183: 75 } }[solder];
  let peak = base.peak, soak = base.soak, tal = base.tal, ta183 = base.ta183;
  let rampUp = 2.0, rampDown = -2.5, chain = 80, deltaT = 8;
  if (comp === '大热容') { peak += 3; tal += 10; chain -= 10; }
  if (comp === 'BGA多') { peak += 2; rampUp = 1.5; deltaT = 12; }
  if (comp === '细间距') { rampUp = 1.8; tal -= 5; }
  if (board === '铝基板') { chain -= 15; deltaT += 2; }
  if (board === '陶瓷') { rampUp = 1.5; }
  const clampNotes = [];
  const cl = (name, v, [lo, hi]) => { const r = Math.min(hi, Math.max(lo, v)); if (r !== v) clampNotes.push(name + ' ' + v + ' 超出工艺窗口，已钳制为 ' + r); return r; };
  peak = cl('峰值温度', peak, REFLOW_WINDOW.peak_temp); tal = cl('液相线以上时间', tal, REFLOW_WINDOW.tal);
  soak = cl('均热区温度', soak, REFLOW_WINDOW.soak_temp); ta183 = cl('183℃以上时间', ta183, REFLOW_WINDOW.time_above_183);
  rampUp = cl('升温斜率', rampUp, REFLOW_WINDOW.ramp_up); rampDown = cl('降温斜率', rampDown, REFLOW_WINDOW.ramp_down);
  chain = cl('链速', chain, REFLOW_WINDOW.chain_speed); deltaT = cl('板面温差', deltaT, REFLOW_WINDOW.delta_t);
  const zoneTime = round3(30 / chain * 60); // 假设单温区长 30cm
  const zoneTemps = [round3(soak - 55), round3(soak - 25), soak, soak, round3(soak + 8), round3(peak - 18), peak, 110];
  const zones = zoneTemps.map((tp, i) => ({ zone: i + 1, temp: tp, time: zoneTime }));
  const curve = []; let t = 0, temp = 25;
  const seg = (toTemp, rate) => { const dur = Math.abs(toTemp - temp) / Math.abs(rate), steps = Math.max(1, Math.round(dur / 10)); for (let s = 0; s <= steps; s++) curve.push({ t: round3(t + dur * s / steps), temp: round3(temp + (toTemp - temp) * s / steps) }); t += dur; temp = toTemp; };
  seg(soak, rampUp);
  t += 60; curve.push({ t: round3(t), temp: soak });
  seg(peak, rampUp);
  t += tal / 2; curve.push({ t: round3(t), temp: peak });
  seg(100, rampDown);
  const risks = [];
  if (peak >= 247) risks.push({ defect: '锡珠', level: '中', note: '峰值温度接近窗口上限，锡珠/飞溅风险上升' });
  if (rampUp >= 2.5) risks.push({ defect: '立碑', level: '中', note: '升温斜率偏大，小元件两端受热不均易立碑' });
  if (tal >= 75) risks.push({ defect: '桥连', level: '中', note: '液相线以上时间偏长，锡膏流动性强，注意桥连' });
  if (deltaT >= 12) risks.push({ defect: '虚焊', level: '中', note: '板面温差偏大，大热容元件可能未充分熔化' });
  if (comp === 'BGA多') risks.push({ defect: '空洞', level: '中', note: 'BGA 较多时关注空洞率，建议结合 X-Ray 抽检' });
  if (!risks.length) risks.push({ defect: '—', level: '低', note: '当前参数均在工艺窗口中段，无突出缺陷风险（规则提示，非模型预测）' });
  return { solder, solderCode: REFLOW_SOLDERS[solder], board, comp, peak_temp: peak, tal, ramp_up: rampUp, ramp_down: rampDown, delta_t: deltaT, soak_temp: soak, time_above_183: ta183, chain_speed: chain, zones, curve, risks, clampNotes };
}

/* ---------- PcbDoc 实验性识别：OLE2/CFB 复合文件头校验 + 流目录列举 ----------
   .PcbDoc 是 OLE2/CFB 容器，内部按对象类型分子存储（Pads6 / Components6 等，见 external_evidence.md 第 3 节）。
   本函数只做签名校验 + FAT/目录解析、列出内部条目；记录级坐标解析未实现，调用方必须明确提示。 */
function inspectCFB(bytes) {

  try {
    const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    const shift = dv.getUint16(30, true), secSize = 1 << shift;
    const firstDir = dv.getUint32(48, true), numDIFAT = dv.getUint32(72, true);
    const secOff = sid => (sid + 1) * secSize;
    const difat = [];
    for (let i = 0; i < 109; i++) { const v = dv.getUint32(76 + i * 4, true); if (v < 0xFFFFFFFA) difat.push(v); }
    let nextDIFAT = dv.getUint32(68, true);
    for (let n = 0; n < numDIFAT && nextDIFAT < 0xFFFFFFFA; n++) {
      const off = secOff(nextDIFAT); if (off + secSize > bytes.length) break;
      for (let i = 0; i < secSize / 4 - 1; i++) { const v = dv.getUint32(off + i * 4, true); if (v < 0xFFFFFFFA) difat.push(v); }
      nextDIFAT = dv.getUint32(off + secSize - 4, true);
    }
    const fat = [];
    for (const fs of difat) { const off = secOff(fs); if (off + secSize > bytes.length) continue; for (let i = 0; i < secSize / 4; i++) fat.push(dv.getUint32(off + i * 4, true)); }
    const entries = []; const seen = new Set();
    let sid = firstDir, guard = 0;
    while (sid < 0xFFFFFFFA && guard++ < 10000 && !seen.has(sid)) {
      seen.add(sid); const off = secOff(sid); if (off + secSize > bytes.length) break;
      for (let i = 0; i < secSize / 128; i++) {
        const eo = off + i * 128, nameLen = dv.getUint16(eo + 64, true);
        if (nameLen < 2 || nameLen > 64) continue;
        let name = ''; for (let j = 0; j < nameLen - 2; j += 2) name += String.fromCharCode(dv.getUint16(eo + j, true));
        const type = bytes[eo + 66];
        if (name) entries.push({ name, type: type === 5 ? '根存储' : type === 1 ? '存储' : '流', size: dv.getUint32(eo + 120, true) });
      }
      sid = fat[sid];
    }
    const PCB_NAMES = /^(Pads|Components|Nets|Tracks|Vias|Arcs|Fills|Regions|Texts|Dimensions|Rules|Classes|Board|Connections|FromTos|Embedded|Models|Polygons|ShapeBased|Textures|WideLines|Coordinates)\d*$/;
    const isPcbDoc = entries.some(e => PCB_NAMES.test(e.name)) || entries.some(e => e.name === 'FileHeader');
    return { ok: true, isCFB: true, isPcbDoc, entries, error: null };
  } catch (err) { return { ok: false, isCFB: true, isPcbDoc: false, entries: [], error: 'CFB 目录解析失败：' + err.message }; }
}

  const chips = [];

  for (const ch of chips) {
    paste.push(F('R', ch.x - 0.5, ch.y, 0.5, 0.6, ch.ref), F('R', ch.x + 0.5, ch.y, 0.5, 0.6, ch.ref));
    solder.push(F('R', ch.x - 0.5, ch.y, 0.6, 0.7), F('R', ch.x + 0.5, ch.y, 0.6, 0.7));
    silk.push({ k: 't', x: ch.x, y: ch.y + 1.6, text: ch.ref, w: 1.6, h: 0.8 });
  }
  silk.push({ k: 't', x: 15, y: 24.6, text: 'U1', w: 1.6, h: 0.8 });
  outline.push({ k: 'r', pts: [{ x: 0, y: 0 }, { x: 60, y: 0 }, { x: 60, y: 40 }, { x: 0, y: 40 }], pol: 'D' });
  for (const [x, y] of [[3, 3], [57, 3], [3, 37], [57, 37]]) drill.push({ k: 'h', x, y, d: 2 });
  const layers = [
    { id: 'L1', name: '锡膏-sample.gtp', fileName: 'sample.gtp', kind: 'paste', side: 'T', visible: true, color: KIND_COLOR.paste, prims: paste },
    { id: 'L2', name: '阻焊-sample.gts', fileName: 'sample.gts', kind: 'solder', side: 'T', visible: true, color: KIND_COLOR.solder, prims: solder },
    { id: 'L3', name: '丝印-sample.gto', fileName: 'sample.gto', kind: 'silk', side: 'T', visible: true, color: KIND_COLOR.silk, prims: silk },
    { id: 'L4', name: '板框-sample.gko', fileName: 'sample.gko', kind: 'outline', side: '-', visible: true, color: KIND_COLOR.outline, prims: outline },
    { id: 'L5', name: '钻孔-sample.drl', fileName: 'sample.drl', kind: 'drill', side: '-', visible: true, color: KIND_COLOR.drill, prims: drill },
  ];
  // CAD：元件坐标（阻容8 + LED16 + U1），故意偏移 (1.5, 1.0)
  const cad = [];
  for (const ch of chips) cad.push({ ref: ch.ref, x: ch.x + 1.5, y: ch.y + 1.0, rot: 0, side: 'T' });
  for (let i = 0; i < 16; i++) cad.push({ ref: 'LED' + (i + 1), x: 35 + (i % 4) * 3 + 1.5, y: 10 + Math.floor(i / 4) * 3 + 1.0, rot: 0, side: 'T' });
  cad.push({ ref: 'U1', x: 16.5, y: 21.0, rot: 0, side: 'T' });
  // BOM 原始表（表头 + 5 行：含 2 行未匹配、1 行用量不一致）
  const bomTable = [
    ['料号', '规格', '位置', '用量', '名称'],
    ['R-10K-0603', 'RES10K0603J', 'R1,R2,R3,R4', '4', '电阻'],
    ['C-2.2UF-0402', 'CAP2.2uF10V0402X5RT=0.5', 'C1,C2,C3,C4', '3', '电容'],
    ['LED-RED-1608', 'LED红光0603', 'LED1-LED16', '16', '发光二极管'],
    ['X-OSC-3225', 'XTAL3225-24M', 'X1,X2', '2', '晶振'],
    ['Y-CONN', 'CONN-USB-TYPEC', 'Y1', '1', '连接器'],
  ];
  return {
    layers, cad, bomTable,
    board: { w: 60, h: 40, t: 1.6, ox: 0, oy: 0, corner: '左前' },
    marks: [{ x: 3, y: 3 }, { x: 57, y: 3 }, { x: 3, y: 37 }], markUse: 2,
    panels: [{ x: 0, y: 0, r: 0, bad: false }],

}

<script>
"use strict";
/* ============================================================
   MJ SMT 工作台 — 界面层（DOM/Canvas）

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

let LID = 100;

const S = {
  name: '未命名工程', layers: [], activeLayerId: null, coords: [], cad: [], cadOffset: { x: 0, y: 0 },
  bomRows: [], bomTable: null, bom2Rows: [],
  board: { w: 60, h: 40, t: 1.6, ox: 0, oy: 0, corner: '左前' },
  marks: [{ x: 0, y: 0 }, { x: 0, y: 0 }, { x: 0, y: 0 }], markUse: 2,
  panels: [{ x: 0, y: 0, r: 0, bad: false }], panelPreview: false,
  sel: new Set(), selCoord: null, view: { cx: 30, cy: 20, scale: 9 },
  side: 'T', extractMode: true, measureMode: false, measurePts: [],
  simplifyRules: JSON.parse(JSON.stringify(Core.DEFAULT_SIMPLIFY)),
  codeLib: { 'C-2.2UF-0402': '2.2UF-10V-0402C-X5R', 'R-10K-0603': '10K-0603R' },

  undoExtract: [], activeTab: 'place', activeMod: 'smt',
  fixtureParams: null, annotations: [], _imported: false, _exported: false,
};
const layerById = id => S.layers.find(l => l.id === id);
const activeLayer = () => layerById(S.activeLayerId);
function msg(t) { $('#statusMsg').textContent = t; }
let toastTimer = null;
function toast(t, ms = 2600) { const el = $('#toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.style.display = 'none', ms); }
function download(name, content, mime = 'text/plain') {
  S._exported = true;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type: mime + ';charset=utf-8' }));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);

/* ---------- 工程保存/读取 ---------- */
function projectObj() {
  return { name: S.name, layers: S.layers, coords: S.coords, cad: S.cad, cadOffset: S.cadOffset, bomRows: S.bomRows,
    board: S.board, marks: S.marks, markUse: S.markUse, panels: S.panels, simplifyRules: S.simplifyRules,
    codeLib: S.codeLib, customers: S.customers, plans: S.plans, templates: S.templates, ballCoords: S.ballCoords, settings: S.settings };
}
function applyProject(p) {
  Object.assign(S, { name: p.name || '未命名工程', layers: p.layers || [], coords: p.coords || [], cad: p.cad || [],
    cadOffset: p.cadOffset || { x: 0, y: 0 }, bomRows: p.bomRows || [], board: p.board || S.board, marks: p.marks || S.marks,
    markUse: p.markUse ?? 2, panels: p.panels?.length ? p.panels : [{ x: 0, y: 0, r: 0, bad: false }],
    simplifyRules: p.simplifyRules || S.simplifyRules, codeLib: p.codeLib || {}, customers: p.customers || [],
    plans: p.plans || [], templates: p.templates || [], ballCoords: p.ballCoords || [], settings: p.settings || S.settings });
  S.activeLayerId = S.layers[0]?.id || null; S.sel.clear(); S.selCoord = null;
  $('#projName').textContent = S.name; fitView(); refresh();
}
let saveTimer = null;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { try { localStorage.setItem('xg-smt-proj', Core.serializeProject(projectObj())); $('#saveState').textContent = '已自动保存 ' + new Date().toLocaleTimeString(); } catch (e) { } }, 400);
}
function refresh() { renderLayers(); draw(); renderTab(); updateStatus(); save(); }
function updateStatus() {
  const al = activeLayer();
  $('#stLayer').textContent = al ? al.name : '-';
  $('#stSel').textContent = S.sel.size;
  $('#stCoords').textContent = S.coords.length;
  $('#stZoom').textContent = Math.round(S.view.scale / 9 * 100) + '%';
}

/* ---------- 画布 ---------- */
const cv = $('#cv'), ctx = cv.getContext('2d');
function resizeCanvas() { const r = $('#canvaswrap').getBoundingClientRect(); cv.width = r.width; cv.height = r.height; draw(); }
new ResizeObserver(resizeCanvas).observe($('#canvaswrap'));
const W2S = (x, y) => [(x - S.view.cx) * S.view.scale + cv.width / 2, cv.height / 2 - (y - S.view.cy) * S.view.scale];
const S2W = (px, py) => ({ x: (px - cv.width / 2) / S.view.scale + S.view.cx, y: S.view.cy - (py - cv.height / 2) / S.view.scale });
function fitView() {
  let bb = null;
  for (const l of S.layers) for (const p of l.prims) { const b = Core.primBBox(p); bb = bb ? { x0: Math.min(bb.x0, b.x0), y0: Math.min(bb.y0, b.y0), x1: Math.max(bb.x1, b.x1), y1: Math.max(bb.y1, b.y1) } : b; }
  if (!bb) { S.view = { cx: 30, cy: 20, scale: 9 }; return; }
  const w = Math.max(bb.x1 - bb.x0, 1), h = Math.max(bb.y1 - bb.y0, 1);
  S.view.cx = (bb.x0 + bb.x1) / 2; S.view.cy = (bb.y0 + bb.y1) / 2;
  S.view.scale = Math.max(0.5, Math.min(cv.width / w, cv.height / h) * 0.92);
}
function drawPrim(p, color, lw) {
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw || 1;
  if (p.k === 'f') {
    const [x, y] = W2S(p.x, p.y); const w = Math.max(p.w * S.view.scale, 1.5), h = Math.max(p.h * S.view.scale, 1.5);
    if (p.shape === 'C') { ctx.beginPath(); ctx.arc(x, y, w / 2, 0, 7); ctx.fill(); }
    else ctx.fillRect(x - w / 2, y - h / 2, w, h);
  } else if (p.k === 'l') {
    const [x1, y1] = W2S(p.x1, p.y1), [x2, y2] = W2S(p.x2, p.y2);
    ctx.lineWidth = Math.max(p.w * S.view.scale, 1); ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  } else if (p.k === 'r') {
    ctx.beginPath(); p.pts.forEach((pt, i) => { const [x, y] = W2S(pt.x, pt.y); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.closePath(); ctx.lineWidth = 1.4; ctx.stroke();
  } else if (p.k === 't') {
    const [x, y] = W2S(p.x, p.y); ctx.font = Math.max(9, p.h * S.view.scale) + 'px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(p.text, x, y);
  } else if (p.k === 'h') {
    const [x, y] = W2S(p.x, p.y); ctx.beginPath(); ctx.arc(x, y, Math.max(p.d * S.view.scale / 2, 1.5), 0, 7); ctx.stroke();
  }
}
function draw() {
  if (!cv.width) return;
  ctx.fillStyle = '#0a0a0c'; ctx.fillRect(0, 0, cv.width, cv.height);
  // 坐标轴
  ctx.strokeStyle = '#232329'; ctx.lineWidth = 1;
  let [ax, ay] = W2S(0, 0); ctx.beginPath(); ctx.moveTo(0, ay); ctx.lineTo(cv.width, ay); ctx.moveTo(ax, 0); ctx.lineTo(ax, cv.height); ctx.stroke();
  for (let i = S.layers.length - 1; i >= 0; i--) {
    const l = S.layers[i]; if (!l.visible) continue;
    l.prims.forEach((p, idx) => {
      const sel = S.sel.has(l.id + ':' + idx);
      drawPrim(p, sel ? '#ffffff' : (p.pol === 'C' ? '#3a3b44' : l.color), sel ? 2 : 1);
    });
  }
  // CAD 点（应用重合偏移）
  if (S.cad.length) {
    ctx.fillStyle = '#ff5fd2';
    for (const c of S.cad) { const [x, y] = W2S(c.x + S.cadOffset.x, c.y + S.cadOffset.y); ctx.fillRect(x - 2, y - 2, 4, 4); }
  }
  // 拼板展开预览
  if (S.panelPreview && S.panels.length > 1) {
    const ex = Core.expandPanels(S.coords, S.panels, S.board, { skipBad: true });
    ctx.fillStyle = 'rgba(61,123,255,.5)';
    for (const c of ex) { const [x, y] = W2S(c.x, c.y); ctx.fillRect(x - 2, y - 2, 4, 4); }
  }
  // 贴片坐标
  for (const c of S.coords) {
    const [x, y] = W2S(c.x, c.y); const on = S.selCoord === c;
    ctx.strokeStyle = on ? '#fff' : '#ffd34d'; ctx.lineWidth = on ? 2 : 1.2;
    ctx.beginPath(); ctx.arc(x, y, on ? 7 : 5, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - 8, y); ctx.lineTo(x + 8, y); ctx.moveTo(x, y - 8); ctx.lineTo(x, y + 8); ctx.stroke();
    if (S.view.scale > 4) { ctx.fillStyle = on ? '#fff' : '#ffd34d'; ctx.font = '10px sans-serif'; ctx.textAlign = 'left'; ctx.fillText(c.ref, x + 8, y - 6); }
  }

  ctx.strokeStyle = '#4dd2ff'; ctx.fillStyle = '#4dd2ff'; ctx.font = '10px sans-serif'; ctx.textAlign = 'left';
  S.marks.slice(0, S.markUse).forEach((m, i) => { if (!m.x && !m.y) return; const [x, y] = W2S(m.x, m.y); ctx.beginPath(); ctx.arc(x, y, 6, 0, 7); ctx.stroke(); ctx.fillText('M' + (i + 1), x + 8, y + 3); });

  updateStatus();
}
function hitPrim(wx, wy) {
  for (const l of S.layers) {
    if (!l.visible) continue;
    for (let i = l.prims.length - 1; i >= 0; i--) {
      const p = l.prims[i]; const b = Core.primBBox(p); const tol = 2 / S.view.scale;
      if (wx >= b.x0 - tol && wx <= b.x1 + tol && wy >= b.y0 - tol && wy <= b.y1 + tol) return { layer: l, prim: p, idx: i };
    }

}

  for (const c of S.coords) { const d = Math.hypot(c.x - wx, c.y - wy); if (d < bd) { bd = d; best = c; } }

}

/* 提取：点焊盘 → 坐标（R10/R14） */
function extractFromPad(layer, prim, openSilk) {
  const c = Core.primCenter(prim);
  const side = layer.side === 'B' ? 'B' : 'T';
  let coord = S.coords.find(e => Math.abs(e.x - c.x) < 0.05 && Math.abs(e.y - c.y) < 0.05 && e.side === side);
  if (coord) { msg('已更新坐标 ' + coord.ref + '（重抓不产生重复）'); }
  else {
    coord = { ref: '', x: Core.round3(c.x), y: Core.round3(c.y), rot: 0, side, partNo: '', spec: '', pkg: '', _pads: [] };
    if (prim.name) {
      coord.ref = prim.name;
      const prev = S.coords.find(e => e.ref === prim.name);
      if (prev) { // 同元件另一焊盘：坐标移到两焊盘中点
        prev._pads = prev._pads || [{ x: prev.x, y: prev.y }];
        prev._pads.push({ x: coord.x, y: coord.y });
        prev.x = Core.round3(prev._pads.reduce((s, p) => s + p.x, 0) / prev._pads.length);
        prev.y = Core.round3(prev._pads.reduce((s, p) => s + p.y, 0) / prev._pads.length);
        if (prev._pads.length === 2) prev.padAngle = Core.round3(Math.atan2(prev._pads[1].y - prev._pads[0].y, prev._pads[1].x - prev._pads[0].x) * 180 / Math.PI);
        coord = prev; msg('坐标 ' + coord.ref + ' 已按焊盘组更新中心');
      } else S.coords.push(coord);
    } else {

/* 画布交互 */
let drag = null;
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect(); const mx = e.clientX - r.left, my = e.clientY - r.top;
  const w0 = S2W(mx, my); const f = e.deltaY < 0 ? 1.15 : 1 / 1.15;
  S.view.scale = Math.min(300, Math.max(0.3, S.view.scale * f));
  const w1 = S2W(mx, my); S.view.cx += w0.x - w1.x; S.view.cy += w0.y - w1.y;
  draw();
}, { passive: false });
cv.addEventListener('mousedown', e => {
  const r = cv.getBoundingClientRect(); const px = e.clientX - r.left, py = e.clientY - r.top;
  drag = { x: px, y: py, moved: false, pan: e.button === 1 || e.spaceKey, button: e.button, wx: S2W(px, py) };
  if (e.button === 1) e.preventDefault();
});
cv.addEventListener('mousemove', e => {
  const r = cv.getBoundingClientRect(); const px = e.clientX - r.left, py = e.clientY - r.top;
  const w = S2W(px, py);
  $('#stX').textContent = w.x.toFixed(3); $('#stY').textContent = w.y.toFixed(3);
  $('#roCur').textContent = w.x.toFixed(3) + ', ' + w.y.toFixed(3);

  if (drag.pan && drag.moved) { S.view.cx -= (px - drag.x) / S.view.scale; S.view.cy += (py - drag.y) / S.view.scale; drag.x = px; drag.y = py; draw(); }

cv.addEventListener('mouseup', e => {
  if (!drag) return;

  if (d.pan) return;
  const w = d.wx;
  if (S.measureMode && d.button === 0 && !d.moved) {
    S.measurePts.push({ x: Core.round3(w.x), y: Core.round3(w.y) });
    if (S.measurePts.length === 2) {
      const [a, b] = S.measurePts;
      const dd = Math.hypot(b.x - a.x, b.y - a.y);
      $('#roMeas').textContent = dd.toFixed(3) + ' mm';

      msg('测量距离 ' + dd.toFixed(3) + 'mm'); S.measurePts = [];
    }
    draw(); return;
  }

});

    { name: '整理', done: S.layers.some(l => l.kind !== 'unknown'), info: '自动分层：' + (S.layers.map(l => Core.KIND_CN[l.kind] || l.kind).join(' / ') || '无') },
    { name: '翻转', done: hasB, info: hasB ? '已有底层（B 面）图层' : '暂无 B 面图层（单面板可跳过此步）' },

    { name: '合并', done: S.panels.length > 1, info: '拼板 ' + S.panels.length + ' 块' },
    { name: '下载', done: S._exported, info: S._exported ? '本次会话已导出过文件' : '尚未导出' },
  ];
  const cur = steps.findIndex(s => !s.done);

function doAlign(verbose) {
  if (!S.cad.length) { toast('先导入 CAD'); return null; }
  const pads = Core.componentCenters(S.layers.filter(l => l.kind === 'paste').flatMap(l => l.prims));
  if (!pads.length) { toast('没有焊盘层可对齐'); return null; }
  const t0 = performance.now();
  const r = Core.alignCadToPads(S.cad, pads);
  S.cadOffset = { x: r.dx, y: r.dy };
  const txt = `智能重合完成：偏移 (${r.dx}, ${r.dy})，配对 ${r.pairs} 点，平均偏差 ${r.avgDev} mm`;
  msg(txt); if (verbose) { const m = $('#mcAlignMsg'); if (m) m.textContent = txt; }
  $('#stTime').textContent = '耗时 ' + ((performance.now() - t0) / 1000).toFixed(2) + 's';
  draw(); save(); return r;
}

/* ---------- 治具生成模块（参数口径 zhiju；2D 俯视示意，3D 建模未做） ---------- */
const FIX_FIELDS = [
  ['pcb.thickness', '板厚 mm'], ['pcb.clearance_per_side', '外形间隙（每边）mm'], ['pcb.clearance_tolerance', '间隙公差 mm'],
  ['fixture.edge_margin', '治具边距 mm'], ['fixture.total_height', '治具总高 mm'], ['fixture.cavity_depth', '沉腔深度 mm'], ['fixture.support_rim_width', '承托台阶宽 mm'],
  ['fillet.radius', '安全倒角深度 mm'], ['notch.type', '取板凹口方案'], ['notch.radius', '凹口半径 mm'], ['notch.reach', '凹口 reach mm'], ['notch.length', '凹口长 mm'], ['notch.depth', '凹口深 mm'],
  ['corner_magnets.diameter', '角磁体直径 mm'], ['corner_magnets.depth', '角磁体深 mm'], ['corner_magnets.inset', '角磁体内缩 mm'],
  ['side_fix.mode', '对立面固定（magnet/screw）'], ['pins.fit_clearance_per_side', '定位销配合间隙（每边）mm'], ['pins.anti_fool', '定位销防呆（一圆一方）'],
  ['mounting_holes.min_dia', '安装孔识别最小孔径 mm'], ['mounting_holes.max_dia', '安装孔识别最大孔径 mm'], ['mounting_holes.max_count', '安装孔最多识别数'],
];
function fixGet(P, path) { return path.split('.').reduce((o, k) => o?.[k], P); }
function fixSet(P, path, v) { const ks = path.split('.'); let o = P; ks.slice(0, -1).forEach(k => o = o[k]); o[ks[ks.length - 1]] = v; }
function renderFixtureMod(el) {
  if (!S.fixtureParams) S.fixtureParams = JSON.parse(JSON.stringify(Core.FIXTURE_DEFAULTS));
  const P = S.fixtureParams;
  el.innerHTML = `
  <div class="split"><div>
    <div class="sec"><h4>治具参数（默认值 = zhiju 仓库 config.json 原值）</h4>
    ${FIX_FIELDS.map(([path, label]) => {
      const v = fixGet(P, path);
      return `<div class="kv2"><span>${label}</span>${typeof v === 'boolean' ? `<input type="checkbox" data-fx="${path}" ${v ? 'checked' : ''}>` : `<input data-fx="${path}" value="${esc(v)}" style="width:130px">`}</div>`;
    }).join('')}
    <div class="btnrow"><button id="fxDraw" class="acc">按参数重画示意图</button><button id="fxReset">恢复默认参数</button>
    <button id="fxCsv">导出参数表 CSV</button><button id="fxJson">导出参数 JSON</button></div>
    <div class="note">参数体系来自开源仓库 StarCompute/zhiju（波峰焊/测试治具生成器，AGPL-3.0）的真实 config.json；本页只复刻参数与 2D 俯视示意，<b>3D 模型（STL/GLB）生成未做</b>，需要 3D 时请部署原仓库服务。</div></div>
  </div><div style="flex:1.4">
    <div class="sec"><h4>俯视示意图（点选元件看信息卡）</h4>
    <canvas id="fxCv" width="560" height="420" style="background:#17181d; border:1px solid var(--line); max-width:100%"></canvas>
    <div class="note" id="fxInfo">板 ${S.board.w}×${S.board.h}mm · 元件 ${S.coords.length} 个（来自当前工程坐标）。点图上的元件块弹出信息卡。</div></div>
  </div></div>`;
  const drawFx = () => {
    FIX_FIELDS.forEach(([path]) => { const inp = el.querySelector(`[data-fx="${path}"]`); if (!inp) return; const cur = fixGet(P, path); if (typeof cur === 'boolean') fixSet(P, path, inp.checked); else if (typeof cur === 'number') fixSet(P, path, +inp.value || 0); else fixSet(P, path, inp.value); });
    const cvx = el.querySelector('#fxCv'); if (!cvx) return;
    const g = cvx.getContext('2d');
    const L = Core.fixtureLayout(S.board, P);
    const sc = Math.min((cvx.width - 30) / L.outerW, (cvx.height - 30) / L.outerH);
    const ox = (cvx.width - L.outerW * sc) / 2, oy = (cvx.height - L.outerH * sc) / 2;
    const X = x => ox + x * sc, Y = y => oy + (L.outerH - y) * sc;
    g.clearRect(0, 0, cvx.width, cvx.height);
    g.strokeStyle = '#8a8b98'; g.lineWidth = 2; g.strokeRect(X(0), Y(L.outerH), L.outerW * sc, L.outerH * sc); // 治具外形
    g.strokeStyle = '#c9a227'; g.lineWidth = 1; g.strokeRect(X(L.cavityX), Y(L.cavityY + L.cavityH), L.cavityW * sc, L.cavityH * sc); // 沉腔
    g.strokeStyle = '#39d353'; g.strokeRect(X(L.boardX), Y(L.boardY + S.board.h), S.board.w * sc, S.board.h * sc); // 板外形
    g.fillStyle = '#58a6ff';
    for (const mg of L.magnets) { g.beginPath(); g.arc(X(mg.x), Y(mg.y), Math.max(3, mg.d / 2 * sc), 0, 7); g.fill(); } // 角磁体
    g.strokeStyle = '#ff9f43'; g.beginPath(); g.arc(X(L.outerW / 2), Y(L.outerH), Math.max(4, P.notch.radius * sc), 0, Math.PI); g.stroke(); // 取板凹口（上边中点示意）
    for (const c of S.coords) {
      const info = Core.fixtureCompInfo(c); const [w, h] = info.size.split('×').map(parseFloat);
      g.fillStyle = S._fxSel === c ? '#ff9f43' : '#3a3b46';
      g.fillRect(X(L.boardX + c.x - w / 2), Y(L.boardY + c.y + h / 2), Math.max(2, w * sc), Math.max(2, h * sc));
    }
    cvx._fx = { L, sc, ox, oy };
  };
  drawFx();
  el.querySelector('#fxCv').addEventListener('click', e => {
    const cvx = e.target, r = cvx.getBoundingClientRect(), f = cvx._fx; if (!f) return;
    const px = (e.clientX - r.left) * (cvx.width / r.width), py = (e.clientY - r.top) * (cvx.height / r.height);
    const wx = (px - f.ox) / f.sc - f.L.boardX, wy = f.L.outerH - (py - f.oy) / f.sc - f.L.boardY;
    let best = null, bd = 1e9;
    for (const c of S.coords) { const d = Math.hypot(c.x - wx, c.y - wy); if (d < bd) { bd = d; best = c; } }
    if (!best || bd > 4) { el.querySelector('#fxInfo').textContent = '没点中元件（最近 ' + (best ? bd.toFixed(1) + 'mm' : '—') + '）'; return; }
    S._fxSel = best;
    const i = Core.fixtureCompInfo(best);
    el.querySelector('#fxInfo').innerHTML = `<b style="font-size:15px">${esc(i.ref)}</b> <span class="tag y">${esc(i.type)}</span><br>` +
      `所在层：${esc(i.layer)}<br>类型：${esc(i.type)}<br>封装：${esc(i.pkg)}<br>尺寸 L×W×H：${esc(i.size)}<br>坐标：${i.x}, ${i.y}<br>旋转：${i.rot}°<br>引脚：${i.pins}`;
    drawFx();
  });
  el.querySelector('#fxDraw').addEventListener('click', () => { drawFx(); save(); msg('治具示意图已按参数重画'); });
  el.querySelector('#fxReset').addEventListener('click', () => { S.fixtureParams = JSON.parse(JSON.stringify(Core.FIXTURE_DEFAULTS)); renderFixtureMod(el); });
  el.querySelector('#fxCsv').addEventListener('click', () => {
    drawFx();
    download('治具参数.csv', '参数,值\n' + FIX_FIELDS.map(([path, label]) => `${path}（${label}）,${fixGet(P, path)}`).join('\n'), 'text/csv');
  });
  el.querySelector('#fxJson').addEventListener('click', () => { drawFx(); download('治具参数.json', JSON.stringify(P, null, 2), 'application/json'); });
}

/* ---------- 图片标注模块（YOLO 闭环前半段：标注 + 数据集导出） ---------- */
function renderAnnotateMod(el) {
  if (!S.annotations) S.annotations = [];
  el.innerHTML = `
  <div class="sec"><div class="note" style="color:#f0b429">训练/检测需外部服务，本页只做标注与数据集导出——本页不会识别元件，不要当检测结果用。标注坐标为原图像素坐标，可导出 JSON 数据集，拿去外部 YOLO 服务/训练流程使用。</div>
  <div class="btnrow"><button id="anLoad" class="acc">载入板子照片</button>
  <span class="pill">标注方式</span><button id="anPt" class="tgl on">点选</button><button id="anBox" class="tgl">框选</button>
  <span class="pill">名称</span><input id="anLabel" placeholder="如 0402电阻 / BGA" style="width:150px">
  <button id="anExport" class="grn">导出标注 JSON</button><button id="anClear">清空标注</button></div>
  <input type="file" id="anFile" accept="image/*" style="display:none">
  <div class="note" id="anMsg">先载入一张照片，再在图上点选/拖框标注。</div></div>
  <canvas id="anCv" width="900" height="560" style="background:#17181d; border:1px solid var(--line); max-width:100%"></canvas>
  <div style="max-height:220px; overflow:auto"><table><thead><tr><th>#</th><th>类型</th><th>名称</th><th>X</th><th>Y</th><th>W</th><th>H</th><th></th></tr></thead><tbody id="anList"></tbody></table></div>`;
  const cvx = el.querySelector('#anCv'), g = cvx.getContext('2d');
  let img = null, mode = 'point', drag = null;
  const drawAn = () => {
    g.clearRect(0, 0, cvx.width, cvx.height);
    if (img) g.drawImage(img, 0, 0, cvx.width, cvx.height);
    for (const a of S.annotations) {
      g.strokeStyle = '#39d353'; g.lineWidth = 2; g.fillStyle = '#39d353'; g.font = '12px sans-serif';
      if (a.type === 'box') { const x = a.x * cvx.width / img.naturalWidth, y = a.y * cvx.height / img.naturalHeight, w = a.w * cvx.width / img.naturalWidth, h = a.h * cvx.height / img.naturalHeight; g.strokeRect(x, y, w, h); g.fillText(a.label || '(未命名)', x + 2, Math.max(12, y - 3)); }
      else { const x = a.x * cvx.width / img.naturalWidth, y = a.y * cvx.height / img.naturalHeight; g.beginPath(); g.arc(x, y, 5, 0, 7); g.stroke(); g.fillText(a.label || '(未命名)', x + 8, y + 3); }
    }
    if (drag) { g.strokeStyle = '#ff9f43'; g.strokeRect(drag.x0, drag.y0, drag.x1 - drag.x0, drag.y1 - drag.y0); }
    el.querySelector('#anList').innerHTML = S.annotations.map((a, i) => `<tr><td>${i + 1}</td><td>${a.type === 'box' ? '框选' : '点选'}</td><td>${esc(a.label)}</td><td>${Math.round(a.x)}</td><td>${Math.round(a.y)}</td><td>${Math.round(a.w || 0)}</td><td>${Math.round(a.h || 0)}</td><td><button data-andel="${i}">删</button></td></tr>`).join('') || '<tr><td colspan=8 class="note">暂无标注</td></tr>';
    el.querySelectorAll('[data-andel]').forEach(b => b.addEventListener('click', () => { S.annotations.splice(+b.dataset.andel, 1); drawAn(); }));
  };
  const toImg = (px, py) => { const r = cvx.getBoundingClientRect(); return { x: (px - r.left) * img.naturalWidth / r.width, y: (py - r.top) * img.naturalHeight / r.height, cx: (px - r.left) * cvx.width / r.width, cy: (py - r.top) * cvx.height / r.height }; };
  el.querySelector('#anLoad').addEventListener('click', () => el.querySelector('#anFile').click());
  el.querySelector('#anFile').addEventListener('change', e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    img = new Image();
    img.onload = () => { S._annoImg = { name: f.name, width: img.naturalWidth, height: img.naturalHeight }; el.querySelector('#anMsg').textContent = '已载入 ' + f.name + '（' + img.naturalWidth + '×' + img.naturalHeight + '），在图上' + (mode === 'point' ? '点选' : '拖框') + '标注，名称填在上方输入框。'; drawAn(); };
    img.src = URL.createObjectURL(f);
  });
  el.querySelector('#anPt').addEventListener('click', e => { mode = 'point'; el.querySelector('#anPt').classList.add('on'); el.querySelector('#anBox').classList.remove('on'); });
  el.querySelector('#anBox').addEventListener('click', e => { mode = 'box'; el.querySelector('#anBox').classList.add('on'); el.querySelector('#anPt').classList.remove('on'); });
  cvx.addEventListener('mousedown', e => { if (!img) { toast('先载入照片'); return; } const p = toImg(e.clientX, e.clientY); if (mode === 'box') drag = { x0: p.cx, y0: p.cy, x1: p.cx, y1: p.cy, ix: p.x, iy: p.y }; });
  cvx.addEventListener('mousemove', e => { if (!drag) return; const p = toImg(e.clientX, e.clientY); drag.x1 = p.cx; drag.y1 = p.cy; drawAn(); });
  cvx.addEventListener('mouseup', e => {
    if (!img) return; const p = toImg(e.clientX, e.clientY); const label = el.querySelector('#anLabel').value.trim();
    if (mode === 'point') S.annotations.push({ type: 'point', x: p.x, y: p.y, w: 0, h: 0, label });
    else if (drag) { S.annotations.push({ type: 'box', x: Math.min(drag.ix, p.x), y: Math.min(drag.iy, p.y), w: Math.abs(p.x - drag.ix), h: Math.abs(p.y - drag.iy), label }); drag = null; }
    drawAn();
  });
  el.querySelector('#anExport').addEventListener('click', () => {
    if (!S._annoImg) { toast('先载入照片'); return; }
    download('annotations.json', Core.annotationsToJson(S.annotations, S._annoImg), 'application/json');
    msg('标注数据集已导出：' + S.annotations.length + ' 条（训练/检测需外部服务）');
  });
  el.querySelector('#anClear').addEventListener('click', () => { S.annotations = []; drawAn(); });
  drawAn();
}

/* ---------- BOM 导入弹窗（R4） ---------- */
let bomImportTarget = null; // null=工程BOM | 'compare'=第二份
function openBomImport(target) { bomImportTarget = target; $('#fileBom').click(); }
function guessRole(header, ci) {
  const h = String(header || '').toLowerCase();
  if (/料号|part|物料编码|编码/.test(h)) return '料号';
  if (/规格|spec|型号|描述/.test(h)) return '规格';
  if (/位置|位号|position|ref/.test(h)) return '位置';
  if (/用量|数量|qty|count/.test(h)) return '用量';

/* ---------- 丝印位号补正（R15） ---------- */
const silk = { items: [], idx: 0, undo: [] };
function silkLabelPos(ref) {
  for (const l of S.layers) { if (l.kind !== 'silk') continue; const t = l.prims.find(p => p.k === 't' && p.text === ref); if (t) return { x: t.x, y: t.y }; }
  const cad = S.cad.find(c => c.ref === ref); if (cad) return { x: cad.x + S.cadOffset.x, y: cad.y + S.cadOffset.y };
  return null;
}
function buildSilkItems() {
  const refs = new Set();
  S.cad.forEach(c => refs.add(c.ref));
  S.bomRows.forEach(r => r.refs.forEach(x => refs.add(x)));
  S.layers.filter(l => l.kind === 'silk').forEach(l => l.prims.forEach(p => { if (p.k === 't') refs.add(p.text); }));
  silk.items = [...refs].sort((a, b) => a.localeCompare(b, undefined, { numeric: true })).map(ref => {
    const coord = S.coords.find(c => c.ref === ref);
    return { ref, coord: coord || null, pos: silkLabelPos(ref) };
  });
}
function silkState(it) { return it.coord ? (it.coord.silkOk ? '已确认' : '待核对') : '未识别'; }
function openSilkDlg(focusCoord) {
  buildSilkItems();
  if (!silk.items.length) { toast('没有位号来源：先导入 CAD/BOM 或载入带丝印位号的工程'); return; }
  if (focusCoord) { const i = silk.items.findIndex(it => it.ref === focusCoord.ref); if (i >= 0) silk.idx = i; }
  window.__silkOpen = true;
  const body = showDlg('丝印位号补正（识别引擎为工作流占位，无图像 OCR）', '<div id="silkBody"></div>',
    [{ label: '关闭' }], true);
  renderSilk(body.querySelector('#silkBody'));
}
function renderSilk(el) {
  if (!el) el = $('#silkBody'); if (!el) return;
  const it = silk.items[silk.idx]; if (!it) { el.innerHTML = '<div class="note">无条目</div>'; return; }
  const cnt = { '已确认': 0, '待核对': 0, '未识别': 0 };
  silk.items.forEach(x => cnt[silkState(x)]++);
  const near = it.pos ? S.coords.map(c => ({ c, d: Math.hypot(c.x - it.pos.x, c.y - it.pos.y) })).sort((a, b) => a.d - b.d).slice(0, 5) : [];
  el.innerHTML = `
  <div class="stat3"><div>已确认<b>${cnt['已确认']}</b></div><div>待核对<b>${cnt['待核对']}</b></div><div>未识别<b>${cnt['未识别']}</b></div>
  <div>进度<b>${silk.idx + 1} / ${silk.items.length}</b></div></div>
  <div class="kv2"><span>识别引擎</span><span><select id="skEngine"><option>普通丝印识别</option><option>填充丝印识别</option><option>快速 OCR</option></select>
  <button id="skRun" class="acc">开始识别</button></span></div>
  <div class="note">识别引擎为工作流占位（原产品补正窗有普通/填充/快速 OCR 三个引擎选项）：本软件实际执行的是「位号（CAD/BOM/丝印文字层）↔ 坐标」匹配与写入，没有图像 OCR 引擎，切换引擎不改变匹配口径。</div>
  <div class="kv2"><span>当前位号</span><span style="font-size:18px"><b>${esc(it.ref)}</b> <span class="tag ${silkState(it) === '已确认' ? 'g' : silkState(it) === '待核对' ? 'y' : 'r'}">${silkState(it)}</span></span></div>
  <div class="kv2"><span>手工输入</span><span><input id="skManual" placeholder="输入位号后回车写入并跳下一条" style="width:280px"> <span class="note">回车=写入并下一条 · Ctrl+Z=撤销</span></span></div>
  <div class="sec"><h4>候选坐标（按距离）— 点选写入</h4>
  ${near.map(({ c, d }) => `<button data-cand="${esc(c.ref)}" style="margin:2px">${esc(c.ref)} (${c.x}, ${c.y} · ${d.toFixed(1)}mm)</button>`).join('') || '<span class="note">附近没有坐标</span>'}</div>
  <div class="btnrow"><button id="skPrev">上一条 F11</button><button id="skNext">下一条 F12</button>
  <button id="skWrite" class="acc">确认写入</button><button id="skUndo">撤销 Ctrl+Z</button>
  <span class="pill">角度</span>${[0, 90, 180, 270].map(a => `<button data-ang="${a}">${a}°</button>`).join('')}</div>
  <div style="max-height:180px; overflow:auto"><table><thead><tr><th>#</th><th>位号</th><th>状态</th></tr></thead><tbody>
  ${silk.items.map((x, i) => `<tr data-row="${i}" class="${i === silk.idx ? 'sel' : ''}"><td>${i + 1}</td><td>${esc(x.ref)}</td><td>${silkState(x)}</td></tr>`).join('')}
  </tbody></table></div>`;
  el.querySelectorAll('[data-row]').forEach(tr => tr.addEventListener('click', () => { silk.idx = +tr.dataset.row; renderSilk(el); }));
  el.querySelectorAll('[data-cand]').forEach(b => b.addEventListener('click', () => { const c = S.coords.find(x => x.ref === b.dataset.cand); if (c) silkAssign(it, c, el); }));
  el.querySelectorAll('[data-ang]').forEach(b => b.addEventListener('click', () => { if (it.coord) { it.coord.rot = +b.dataset.ang; refresh(); } }));
  $('#skRun').addEventListener('click', () => runSilkRecognize(el));
  $('#skPrev').addEventListener('click', () => { silk.idx = Math.max(0, silk.idx - 1); renderSilk(el); });
  $('#skNext').addEventListener('click', () => { silk.idx = Math.min(silk.items.length - 1, silk.idx + 1); renderSilk(el); });
  $('#skWrite').addEventListener('click', () => silkConfirm(it, el));
  $('#skUndo').addEventListener('click', () => { silkUndo(); renderSilk(el); });
  $('#skManual').addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const v = e.target.value.trim(); if (!v) return;
    it.ref = v; silkConfirm(it, el, true);
  });
}
function silkAssign(it, coord, el) {
  silk.undo.push({ coord, prevRef: coord.ref, prevOk: coord.silkOk });
  coord.ref = it.ref; coord.silkOk = true; it.coord = coord;
  msg('已写入位号 ' + it.ref); refresh(); renderSilk(el);
}
function silkConfirm(it, el, advance) {
  if (it.coord) { silk.undo.push({ coord: it.coord, prevRef: it.coord.ref, prevOk: it.coord.silkOk }); it.coord.silkOk = true; }
  else {
    const free = it.pos ? S.coords.filter(c => /^A_|^P_/.test(c.ref)).sort((a, b) => Math.hypot(a.x - it.pos.x, a.y - it.pos.y) - Math.hypot(b.x - it.pos.x, b.y - it.pos.y))[0] : null;
    if (free && it.pos && Math.hypot(free.x - it.pos.x, free.y - it.pos.y) <= 12) silkAssign(it, free, el);
    else if (it.pos) { const c = { ref: it.ref, x: it.pos.x, y: it.pos.y, rot: 0, side: 'T', partNo: '', spec: '', pkg: '', silkOk: true }; S.coords.push(c); it.coord = c; silk.undo.push({ coord: c, prevRef: null, prevOk: false }); }
    else { toast('该位号没有位置来源，无法写入'); return; }
  }
  msg('已确认 ' + it.ref); refresh();
  if (advance !== false) silk.idx = Math.min(silk.items.length - 1, silk.idx + 1);
  renderSilk(el);
}
function silkUndo() {
  const u = silk.undo.pop(); if (!u) { toast('没有可撤销的写入'); return; }
  if (u.prevRef === null) S.coords = S.coords.filter(c => c !== u.coord);
  else { u.coord.ref = u.prevRef; u.coord.silkOk = u.prevOk; }
  buildSilkItems(); msg('已撤销上一次位号写入'); refresh();
}
/* 丝印识别执行 + 进度窗（xiaocai_gaps.md 缺口 7 实证样式：画布中央深色模态窗——
   「丝印 N 组，匹配中 x/N（含已有坐标），写入 y/N」+ 已用时间 + 进度条 % + 「取消坐标提取」按钮，取消真能中断） */
function runSilkRecognize(el) {
  const total = silk.items.length;
  if (!total) { toast('没有可识别的位号组'); return; }
  let prog = document.getElementById('silkProg');
  if (prog) prog.remove();
  prog = document.createElement('div'); prog.id = 'silkProg';
  prog.innerHTML = `<div class="sp-box">
    <div id="spLine1" style="font-size:14px">丝印 ${total} 组，匹配中 0/${total}（含已有坐标），写入 0/${total}</div>
    <div id="spTime" style="margin-top:6px; color:var(--mut)">已用时间：0:00:00</div>
    <div class="sp-bar"><div class="sp-fill" id="spFill"></div></div>
    <div style="text-align:right" id="spPct">0%</div>
    <div class="btnrow" style="margin-top:8px"><button id="spCancel">取消坐标提取</button><button id="spClose" class="acc" style="display:none">完成</button></div></div>`;
  document.body.appendChild(prog);
  const t0 = Date.now();
  let i = 0, matched = 0, written = 0, cancelled = false;
  const fmtT = ms => { const s = Math.floor(ms / 1000); return '0:' + String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
  prog.querySelector('#spCancel').addEventListener('click', () => { cancelled = true; });
  prog.querySelector('#spClose').addEventListener('click', () => { prog.remove(); renderSilk(el); });
  const step = () => {
    const chunk = Math.max(1, Math.round(total / 40));
    for (let n = 0; n < chunk && i < total; n++, i++) {
      const it = silk.items[i];
      if (it.coord) { matched++; continue; }
      if (!it.pos) continue;
      const free = S.coords.filter(c => /^A_|^P_/.test(c.ref)).sort((a, b) => Math.hypot(a.x - it.pos.x, a.y - it.pos.y) - Math.hypot(b.x - it.pos.x, b.y - it.pos.y))[0];
      if (free && Math.hypot(free.x - it.pos.x, free.y - it.pos.y) <= 12) {
        silk.undo.push({ coord: free, prevRef: free.ref, prevOk: free.silkOk });
        free.ref = it.ref; free.silkOk = true; it.coord = free; matched++; written++;
      } else {
        const c = { ref: it.ref, x: it.pos.x, y: it.pos.y, rot: 0, side: 'T', partNo: '', spec: '', pkg: '', silkOk: true };
        S.coords.push(c); it.coord = c; silk.undo.push({ coord: c, prevRef: null, prevOk: false }); matched++; written++;
      }
    }
    const pct = Math.round(i / total * 100);
    prog.querySelector('#spLine1').textContent = `丝印 ${total} 组，匹配中 ${matched}/${total}（含已有坐标），写入 ${written}/${total}`;
    prog.querySelector('#spTime').textContent = '已用时间：' + fmtT(Date.now() - t0);
    prog.querySelector('#spFill').style.width = pct + '%';
    prog.querySelector('#spPct').textContent = pct + '%';
    if (cancelled || i >= total) {
      prog.querySelector('#spCancel').style.display = 'none';
      const closeBtn = prog.querySelector('#spClose');
      closeBtn.style.display = ''; closeBtn.textContent = cancelled ? '已取消（关闭）' : '完成';
      prog.querySelector('#spLine1').textContent += cancelled ? '（已取消）' : '（完成）';
      refresh();
      msg(`丝印识别${cancelled ? '已取消' : '完成'}：共 ${total} 组，匹配 ${matched}，写入 ${written}`);
      return;
    }
    setTimeout(step, 60);
  };
  step();
}

/* ---------- 焊盘模板库（R16） ---------- */
function saveTemplate() {
  const sel = selectedPrims().filter(p => p.prim.k === 'f');
  if (!sel.length) { toast('先在画布选中一组焊盘'); return; }
  const c0 = Core.primCenter(sel[0].prim);
  const tpl = { group: '默认', name: '模板' + (S.templates.length + 1), pads: sel.map(p => { const c = Core.primCenter(p.prim); return { dx: Core.round3(c.x - c0.x), dy: Core.round3(c.y - c0.y), shape: p.prim.shape, w: p.prim.w, h: p.prim.h }; }), pins: sel.length, refAngle: 0 };
  S.templates.push(tpl); msg('已保存焊盘模板 ' + tpl.name + '（' + tpl.pins + ' 焊盘）'); save();
}
function findByTemplate() {
  const tpl = S.templates[S.templates.length - 1];
  if (!tpl) { toast('先存一个焊盘模板'); return; }
  const l = S.layers.find(x => x.kind === 'paste') || activeLayer(); if (!l) return;
  S.sel.clear();
  let n = 0;
  l.prims.forEach((p, i) => { if (p.k === 'f' && p.shape === tpl.pads[0].shape && Math.abs(p.w - tpl.pads[0].w) < 0.02 && Math.abs(p.h - tpl.pads[0].h) < 0.02) { S.sel.add(l.id + ':' + i); n++; } });
  msg('按模板「' + tpl.name + '」首焊盘形状找到 ' + n + ' 处（已选中）'); refresh();
}

function coordCheck() {
  const seen = new Map(); const dups = [];
  for (const c of S.coords) { const k = c.x + ',' + c.y; if (seen.has(k)) dups.push(c.ref + ' 与 ' + seen.get(k) + ' 重叠'); else seen.set(k, c.ref); }
  const refCount = {}; S.coords.forEach(c => refCount[c.ref] = (refCount[c.ref] || 0) + 1);
  const dupRefs = Object.entries(refCount).filter(([, n]) => n > 1).map(([r]) => r);
  showDlg('坐标检查（重复/重叠）', `<div style="line-height:2">坐标总数 ${S.coords.length}<br>位置重叠：${dups.length ? '<br>' + dups.map(esc).join('<br>') : '无'}<br>位号重复：${dupRefs.length ? dupRefs.join(',') : '无'}</div>`, [{ label: '关闭' }]);
  msg('坐标检查完成：重叠 ' + dups.length + '，位号重复 ' + dupRefs.length);
}
function findSameAction() {
  const sel = selectedPrims().filter(p => p.prim.k === 'f');
  if (!sel.length) { toast('先选中一个焊盘'); return; }
  const t = sel[0]; const same = Core.findSamePads(t.layer.prims, t.prim);
  S.sel.clear(); same.forEach(p => S.sel.add(t.layer.id + ':' + t.layer.prims.indexOf(p)));
  msg('查找相同：同形状同尺寸焊盘 ' + same.length + ' 个（已选中，可在贴片数据页批量提取）'); refresh();
}
function rotSel(deg) { if (!S.selCoord) { toast('先选一个坐标'); return; } S.selCoord.rot = (S.selCoord.rot + deg) % 360; msg(S.selCoord.ref + ' 角度 → ' + S.selCoord.rot + '°'); refresh(); }
function doAngleCorrect() {
  const before = S.coords.map(c => c.rot);
  const changes = Core.correctDirections(S.coords);
  const first = changes[0];
  msg(`方向校正完成：已校 ${changes.length}/${S.coords.length}` + (first ? `，如 ${first.ref} ${first.from}°→${first.to}°` : ''));
  refresh();
}
function openPkgCheck() {
  const bad = [];
  for (const c of S.coords) {
    const fromSpec = Core.pkgOfString(c.spec);
    if (c.pkg && fromSpec && c.pkg !== fromSpec) bad.push({ c, why: '坐标封装 ' + c.pkg + ' ≠ BOM/规格 ' + fromSpec });
    else if (!Core.COMPONENT_DB.some(d => d.pkg === (c.pkg || fromSpec))) { if (c.spec) bad.push({ c, why: '封装 ' + (c.pkg || fromSpec || '未知') + ' 不在元件库' }); }
  }
  const body = showDlg('封装检查', bad.length ? '<table><thead><tr><th>位号</th><th>问题</th></tr></thead><tbody>' + bad.map((b, i) => `<tr data-pkg="${i}"><td>${esc(b.c.ref)}</td><td>${esc(b.why)}</td></tr>`).join('') + '</tbody></table><div class="note">点行跳画布定位</div>' : '<div class="note">检查通过：无封装不一致</div>', [{ label: '关闭' }], true);
  body.querySelectorAll('[data-pkg]').forEach(tr => tr.addEventListener('click', () => { const c = bad[+tr.dataset.pkg].c; S.selCoord = c; S.view.cx = c.x; S.view.cy = c.y; closeDlg(); refresh(); }));
  msg('封装检查：不一致 ' + bad.length + ' 条');
}

      const dx = +body.querySelector('#cvDX').value || 0, dy = +body.querySelector('#cvDY').value || 0;
      const rot = (+body.querySelector('#cvRot').value || 0) * Math.PI / 180, mx = body.querySelector('#cvMX').checked;
      const targets = body.querySelector('#cvScope').value === 'all' ? S.coords : (S.selCoord ? [S.selCoord] : []);
      for (const c of targets) {
        let x = c.x + dx, y = c.y + dy;
        if (rot) { const nx = x * Math.cos(rot) - y * Math.sin(rot), ny = x * Math.sin(rot) + y * Math.cos(rot); x = nx; y = ny; c.rot = (c.rot + +body.querySelector('#cvRot').value) % 360; }
        if (mx) x = S.board.w - x;
        c.x = Core.round3(x); c.y = Core.round3(y);
      }
      msg('坐标转换完成 ' + targets.length + ' 个'); refresh();
    } }]);
});
$('#tbSample').addEventListener('click', loadSample);

/* ---------- 文件导入 ---------- */
async function addGerberText(name, text) {
  const cls = Core.classifyLayer(name);
  let parsed;
  if (cls.kind === 'drill' || /\.drl$/i.test(name)) parsed = Core.parseDrill(text);
  else parsed = Core.parseGerber(text, name);
  const layer = { id: newLayerId(), name: (Core.KIND_CN[cls.kind] || '') + '-' + name, fileName: name, kind: cls.kind, side: cls.side, visible: true, color: Core.KIND_COLOR[cls.kind], prims: parsed.prims, error: parsed.prims.length ? null : (parsed.errors[0] || '解析失败') };
  S.layers.push(layer);
  /* 红胶勾选（设置页/套件导出）：导入锡膏层时按元件名分组取中心派生红胶层（细则口径见 Core.deriveGluePrims 注释） */
  if (cls.kind === 'paste' && S.settings.glue) {
    const glue = Core.deriveGluePrims(parsed.prims, { dia: S.settings.glueDia || 1.0 });
    if (glue.length) S.layers.push({ id: newLayerId(), name: '红胶-' + name, fileName: name.replace(/\.[^.]*$/, '') + (cls.side === 'B' ? '.glub' : '.glu'), kind: 'glue', side: cls.side, visible: true, color: '#e5484d', prims: glue, error: null });
  }
  return layer;
}
/* 文本编码嗅探：EasyEDA 等国产工具导出的 BOM/坐标文件常是 UTF-16LE（带 BOM 头），
   浏览器默认按 UTF-8 读会满屏空字符；先看 BOM 头再选编码，无头时含大量 NUL 也按 UTF-16 处理。 */
function decodeSmart(data) {
  const b = data instanceof Uint8Array ? data : new Uint8Array(data);
  if (b.length >= 2 && b[0] === 0xFF && b[1] === 0xFE) return new TextDecoder('utf-16le').decode(b);
  if (b.length >= 2 && b[0] === 0xFE && b[1] === 0xFF) return new TextDecoder('utf-16be').decode(b);
  if (b.length >= 3 && b[0] === 0xEF && b[1] === 0xBB && b[2] === 0xBF) return new TextDecoder('utf-8').decode(b);
  let nul = 0; const n = Math.min(b.length, 200);
  for (let i = 0; i < n; i++) if (b[i] === 0) nul++;
  if (n > 20 && nul / n > 0.2) return new TextDecoder('utf-16le').decode(b);
  return new TextDecoder('utf-8').decode(b);
}
async function readTextSmart(f) { return decodeSmart(new Uint8Array(await f.arrayBuffer())); }
async function addZipBytes(bytes) {
  const entries = await Core.unzip(bytes);
  let n = 0;
  for (const en of entries) {
    if (/\/$/.test(en.name)) continue;
    const base = en.name.split('/').pop();
    if (!/\.(gtp|gts|gto|gtl|gko|gbl|gbs|gbo|gbp|ger|gbr|drl)$/i.test(base)) continue;
    await addGerberText(base, decodeSmart(en.data)); n++;
  }
  return n;
}
$('#fileGerber').addEventListener('change', async e => {
  const files = [...e.target.files]; e.target.value = '';
  for (const f of files) {
    if (/\.zip$/i.test(f.name)) await addZipBytes(new Uint8Array(await f.arrayBuffer()));
    else await addGerberText(f.name, await readTextSmart(f));
  }
  S._imported = true;
  S.activeLayerId = S.layers[S.layers.length - 1]?.id || null;
  fitView(); refresh(); msg('已导入 ' + files.length + ' 个文件，共 ' + S.layers.length + ' 层');
});
$('#fileZip').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try { const n = await addZipBytes(new Uint8Array(await f.arrayBuffer())); S._imported = true; fitView(); refresh(); msg('ZIP 已解开：导入 ' + n + ' 个层文件'); }
  catch (err) { toast('ZIP 解开失败：' + err.message); }
});
$('#fileCad').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const r = Core.parseCAD(await readTextSmart(f));
  if (r.error) { toast(r.error); return; }
  S.cad = r.pts; S.cadOffset = { x: 0, y: 0 }; msg('CAD 已导入 ' + r.pts.length + ' 个点，可点「智能重合」对齐'); refresh();
});
async function readBomTableFile(f) {
  if (/\.xlsx$/i.test(f.name)) return await Core.parseXLSX(new Uint8Array(await f.arrayBuffer()));
  return Core.parseCSVText(await readTextSmart(f));
}
$('#fileBom').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try { showBomTableDlg(await readBomTableFile(f)); } catch (err) { toast('BOM 读取失败：' + err.message); }
});
$('#fileProj').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try { applyProject(Core.deserializeProject(await readTextSmart(f))); msg('工程已打开'); } catch (err) { toast('工程打开失败：' + err.message); }
});
/* PcbDoc 实验性入口：只做 OLE2/CFB 文件头校验 + 内部流目录列举，坐标解析未实现 */
$('#filePcb').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const r = Core.inspectCFB(new Uint8Array(await f.arrayBuffer()));
  if (!r.ok) { showDlg('PcbDoc 识别（实验性）', `<div class="note" style="color:#f87171">${esc(r.error)}</div><div class="note">已明确拒绝：该文件无法识别为 PcbDoc 容器，未做任何导入。</div>`, [{ label: '关闭' }]); return; }
  showDlg('PcbDoc 识别（实验性）', `
    <div class="note">${r.isPcbDoc ? '已识别为 Altium .PcbDoc（OLE2/CFB 容器，内部含 PcbDoc 对象存储）。' : '这是 OLE2/CFB 复合文件，但内部条目不像 .PcbDoc（未见 Pads6/Components6 等对象存储）。'}</div>
    <div style="max-height:300px; overflow:auto"><table><thead><tr><th>内部条目</th><th>类型</th><th>大小 B</th></tr></thead><tbody>
    ${r.entries.map(en => `<tr><td>${esc(en.name)}</td><td>${esc(en.type)}</td><td>${en.size}</td></tr>`).join('') || '<tr><td colspan=3 class="note">目录为空</td></tr>'}
    </tbody></table></div>
    <div class="note" style="color:#f0b429">实验性到此为止：本入口只完成文件头校验与内部流列举，<b>坐标/焊盘记录解析未实现</b>，不会把该文件导入为图层；如需坐标，请先在 Altium 里导出 Gerber/CAD 再导入。</div>`,
    [{ label: '关闭' }], true);
  msg('PcbDoc 实验性识别完成：' + r.entries.length + ' 个内部条目（未导入图层）');
});
function loadSample() {
  const d = Core.buildSampleData();
  applyProject({ name: '样例工程', layers: d.layers, coords: [], cad: d.cad, bomRows: [], board: d.board, marks: d.marks, markUse: d.markUse, panels: d.panels, settings: S.settings, codeLib: S.codeLib });
  S._sampleBomTable = d.bomTable;
  msg('样例工程已载入：点「BOM+CAD」导入样例 BOM，或在画布点焊盘提取坐标；样例 CAD 已带 1.5mm 偏移可测智能重合');
  toast('样例已载入。样例 BOM 在「文件→导入 BOM」不可用时，可到 BOM+CAD 模块点导入并选此页内置样例', 10);
  // 直接把样例 BOM 备好：点导入BOM时若无文件，用内置样例表
  S.bomRows = Core.bomRowsFromTable(d.bomTable.slice(1), ['料号', '规格', '位置', '用量', '名称']);
  runSimplify(); refresh();
}
